[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqly"
version = "0.2.0"
description = "Self-hosted API monitoring for FastAPI and Flask in two lines: latency percentiles, error rates and release tracking per route, with deploy-aware alerts and weekly AI anomaly reports."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "Tanish Poddar" }]
keywords = [
    "observability", "apm", "monitoring", "fastapi", "flask", "telemetry",
    "metrics", "latency", "percentiles", "alerting", "anomaly-detection",
    "release-tracking", "self-hosted", "timescaledb"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Framework :: Flask",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://reqly.tanisheesh.in"
Repository = "https://github.com/tanisheesh/reqly"
Issues = "https://github.com/tanisheesh/reqly/issues"
Documentation = "https://github.com/tanisheesh/reqly/blob/main/docs/SETUP.md"
Changelog = "https://github.com/tanisheesh/reqly/blob/main/sdk/CHANGELOG.md"
"Live Demo" = "https://reqly-eventflow-dashboard.onrender.com"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.3"]
dev = [
    "pytest>=8.0",
    "fastapi>=0.100",
    "flask>=2.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["reqly*"]
