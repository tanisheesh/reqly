[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqly"
version = "0.6.0"
description = "Self-hosted API monitoring for FastAPI, Flask, Django, Starlette and Litestar in two lines: latency percentiles, error rates and release tracking per route, with deploy-aware alerts and weekly AI anomaly reports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanish Poddar" }]
keywords = [
    "observability", "apm", "monitoring", "fastapi", "flask", "django",
    "starlette", "litestar", "telemetry",
    "metrics", "latency", "percentiles", "alerting", "anomaly-detection",
    "release-tracking", "self-hosted", "timescaledb"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://reqly.tanisheesh.in"
Repository = "https://github.com/tanisheesh/reqly"
Issues = "https://github.com/tanisheesh/reqly/issues"
Documentation = "https://reqly.tanisheesh.in/docs/instrument/python/"
Changelog = "https://github.com/tanisheesh/reqly/blob/main/sdk/CHANGELOG.md"
"Live Demo" = "https://reqly-eventflow-dashboard.onrender.com"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
starlette = ["starlette>=0.27"]
litestar = ["litestar>=2.0"]
flask = ["flask>=2.3"]
django = ["django>=4.2"]
dev = [
    "pytest>=8.0",
    "fastapi>=0.100",
    "litestar>=2.0",
    "flask>=2.3",
    "django>=4.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["reqly*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pyflakes, import order and bugbear. Not B008 (FastAPI's Depends() defaults),
# B904 (HTTPException translation is deliberate) or B905 (zip strictness).
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["reqly"]

[tool.mypy]
files = ["reqly"]
# The oldest mypy can check; ruff (target-version) still covers 3.9 syntax.
python_version = "3.10"
# Framework and driver packages ship partial or no stubs.
ignore_missing_imports = true
