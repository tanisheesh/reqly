services:
  timescaledb:
    # The -ha image bundles the TimescaleDB Toolkit (mergeable percentile
    # sketches) on top of TimescaleDB. It runs as uid 1000 with PGDATA under
    # /home/postgres/pgdata, hence its own volume.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: reqly
      POSTGRES_USER: reqly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - timescale_ha_data:/home/postgres/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqly -d reqly"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build:
      context: ./collector
    environment:
      DATABASE_URL: postgresql://reqly:${POSTGRES_PASSWORD:-localdev}@timescaledb:5432/reqly
      REQLY_INGEST_KEY: ${REQLY_INGEST_KEY:-demo-key}
      REQLY_READ_KEY: ${REQLY_READ_KEY:-demo-read-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ASK_MODEL: ${ASK_MODEL:-}
      ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      INSIGHTS_SCHEDULER_ENABLED: ${INSIGHTS_SCHEDULER_ENABLED:-true}
      LATE_DATA_REFRESH_SECONDS: ${LATE_DATA_REFRESH_SECONDS:-60}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_RENOTIFY_HOURS: ${ALERT_RENOTIFY_HOURS:-6}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:5173}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_COLLECTOR_URL: ${VITE_COLLECTOR_URL:-http://localhost:8000}
        VITE_READ_KEY: ${REQLY_READ_KEY:-demo-read-key}
    ports:
      - "5173:5173"
    depends_on:
      collector:
        condition: service_healthy

  load-generator:
    build:
      context: ./load_generator
    environment:
      REQLY_COLLECTOR_URL: http://collector:8000
      REQLY_INGEST_KEY: ${REQLY_INGEST_KEY:-demo-key}
      BACKFILL_WEEKS: ${BACKFILL_WEEKS:-8}
      BACKFILL_EVENTS_PER_HOUR: ${BACKFILL_EVENTS_PER_HOUR:-30}
      LIVE_RPS: ${LIVE_RPS:-2}
    depends_on:
      collector:
        condition: service_healthy
    restart: on-failure


volumes:
  timescale_ha_data:
