name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims to support.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "./sdk[dev]"
      - run: pytest sdk/tests -v

  sdk-node:
    name: Node SDK tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-node/package-lock.json
      - name: Install dependencies
        working-directory: sdk-node
        run: npm ci
      - name: Build and test
        working-directory: sdk-node
        run: npm test

  sdk-node-bun:
    name: Node SDK on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Build, then run Hono and node:http on Bun
        working-directory: sdk-node
        run: |
          npm ci
          npm run build
          bun test/bun-smoke.mjs

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: reqly
          POSTGRES_USER: reqly
          POSTGRES_PASSWORD: reqly
        options: >-
          --health-cmd "pg_isready -U reqly -d reqly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: collector
        run: pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: collector
        run: pytest tests -v
        env:
          DATABASE_URL: "postgresql://reqly:reqly@localhost:5432/reqly"
          REQLY_INGEST_KEY: "test-key"
          REQLY_READ_KEY: "test-read-key"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Chart version matches the collector
        # Installing from a clone uses appVersion as the image tag; a stale
        # one silently deploys an older collector.
        run: |
          collector=$(python3 -c "import tomllib; print(tomllib.load(open('collector/pyproject.toml', 'rb'))['project']['version'])")
          chart=$(grep -oP '^appVersion: "\K[^"]+' deploy/helm/reqly/Chart.yaml)
          if [ "$chart" != "$collector" ]; then
            echo "::error::deploy/helm/reqly/Chart.yaml appVersion is $chart, collector is $collector"
            exit 1
          fi
      - name: Lint and render
        run: |
          helm lint deploy/helm/reqly
          helm template ci deploy/helm/reqly > /dev/null
          helm template ci deploy/helm/reqly --set ingress.enabled=true --set secrets.groqApiKey=x > /dev/null
          helm template ci deploy/helm/reqly --set timescaledb.enabled=false             --set externalDatabaseUrl=postgresql://u:p@db:5432/reqly --set dashboard.enabled=false > /dev/null

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Type-check and build
        working-directory: dashboard
        run: npm run build
