name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims to support.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "./sdk[dev]"
      - run: pytest sdk/tests -v

  sdk-node:
    name: Node SDK tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-node/package-lock.json
      - name: Install dependencies
        working-directory: sdk-node
        run: npm ci
      - name: Build and test
        working-directory: sdk-node
        run: npm test

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: reqly
          POSTGRES_USER: reqly
          POSTGRES_PASSWORD: reqly
        options: >-
          --health-cmd "pg_isready -U reqly -d reqly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: collector
        run: pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: collector
        run: pytest tests -v
        env:
          DATABASE_URL: "postgresql://reqly:reqly@localhost:5432/reqly"
          REQLY_INGEST_KEY: "test-key"
          REQLY_READ_KEY: "test-read-key"

  dashboard:
    name: Dashboard type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Type-check
        working-directory: dashboard
        run: npx tsc --noEmit
