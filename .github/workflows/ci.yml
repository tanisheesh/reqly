name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type-check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install tools and the packages' dependencies (for mypy)
        run: |
          pip install ruff==0.14.0 mypy==2.4.0
          pip install --require-hashes -r collector/requirements.txt
          pip install -e ./sdk
      - name: ruff
        run: ruff check collector sdk e2e
      - name: mypy (collector)
        working-directory: collector
        run: mypy
      - name: mypy (Python SDK)
        working-directory: sdk
        run: mypy

  sdk:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims to support.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "./sdk[dev]"
      - name: Real LLM clients, for the instrument_openai / instrument_anthropic tests
        if: matrix.python-version != '3.9'
        run: pip install openai anthropic
      - run: pytest sdk/tests -v

  sdk-node:
    name: Node SDK tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-node/package-lock.json
      - name: Install dependencies
        working-directory: sdk-node
        run: npm ci
      - name: Build and test
        working-directory: sdk-node
        run: npm test

  sdk-node-bun:
    name: Node SDK on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Build, then run Hono and node:http on Bun
        working-directory: sdk-node
        run: |
          npm ci
          npm run build
          bun test/bun-smoke.mjs

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: reqly
          POSTGRES_USER: reqly
          POSTGRES_PASSWORD: reqly
        options: >-
          --health-cmd "pg_isready -U reqly -d reqly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install dependencies (from the lock)
        working-directory: collector
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps .
          pip install pytest
      - name: Lock matches pyproject.toml
        working-directory: collector
        # Re-resolving keeps the existing pins, so this only fails when
        # pyproject.toml changed and requirements.txt wasn't recompiled.
        run: |
          pip install uv
          uv pip compile pyproject.toml --universal --python-version 3.11 --generate-hashes --quiet -o requirements.txt             --custom-compile-command "uv pip compile pyproject.toml --universal --python-version 3.11 --generate-hashes -o requirements.txt"
          git diff --exit-code requirements.txt
      - name: Run tests
        working-directory: collector
        run: pytest tests -v
        env:
          DATABASE_URL: "postgresql://reqly:reqly@localhost:5432/reqly"
          REQLY_INGEST_KEY: "test-key"
          REQLY_READ_KEY: "test-read-key"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Chart version matches the collector
        # Installing from a clone uses appVersion as the image tag; a stale
        # one silently deploys an older collector.
        run: |
          collector=$(python3 -c "import tomllib; print(tomllib.load(open('collector/pyproject.toml', 'rb'))['project']['version'])")
          chart=$(grep -oP '^appVersion: "\K[^"]+' deploy/helm/reqly/Chart.yaml)
          if [ "$chart" != "$collector" ]; then
            echo "::error::deploy/helm/reqly/Chart.yaml appVersion is $chart, collector is $collector"
            exit 1
          fi
      - name: Lint and render
        run: |
          helm lint deploy/helm/reqly
          helm template ci deploy/helm/reqly > /dev/null
          helm template ci deploy/helm/reqly --set ingress.enabled=true --set secrets.groqApiKey=x > /dev/null
          helm template ci deploy/helm/reqly --set secrets.llmApiKey=x --set collector.config.LLM_BASE_URL=https://llm.example/v1 > /dev/null
          helm template ci deploy/helm/reqly --set timescaledb.enabled=false             --set externalDatabaseUrl=postgresql://u:p@db:5432/reqly --set dashboard.enabled=false > /dev/null

  dashboard:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Lint (oxlint: ESLint rules incl. react-hooks; typescript-eslint doesn't support TypeScript 7 yet)
        working-directory: dashboard
        run: npm run lint
      - name: Unit tests
        working-directory: dashboard
        run: npm test
      - name: Type-check and build
        working-directory: dashboard
        run: npm run build

  e2e:
    name: End to end (SDKs -> collector -> TimescaleDB -> API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: reqly
          POSTGRES_USER: reqly
          POSTGRES_PASSWORD: reqly
        options: >-
          --health-cmd "pg_isready -U reqly -d reqly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk-node/package-lock.json
      - name: Install the collector (from its lock) and the Python SDK
        run: |
          pip install --require-hashes -r collector/requirements.txt
          pip install --no-deps ./collector
          pip install ./sdk pytest
      - name: Build the Node SDK
        working-directory: sdk-node
        run: |
          npm ci
          npm run build
      - name: Run
        run: pytest e2e -v
        env:
          DATABASE_URL: "postgresql://reqly:reqly@localhost:5432/reqly"
