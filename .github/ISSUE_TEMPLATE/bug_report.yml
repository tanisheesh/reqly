# ╔══════════════════════════════════════════════════════════════════════╗
# ║  TANISH'S SETUP TOOLKIT · tanisheesh.in                              ║
# ║  Bug report form. Goes to: <repo>/.github/ISSUE_TEMPLATE/            ║
# ║  Works as-is in any repo, no placeholders to fill.                   ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: 🐛 Bug report
description: Something isn't working as expected
title: "🐛 "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [existing issues](../issues?q=is%3Aissue) first.
        **Security problem?** Don't post it here. See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click "Sync", the dashboard shows an empty state even though I have commits.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The dashboard should list my latest commits.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Live site
        - Local development
        - Self-hosted / Docker
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser / OS / runtime version, whatever is relevant.
      placeholder: Chrome 129 on Windows 11 · Node 22

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any console output or error text. It's formatted as code automatically.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true

