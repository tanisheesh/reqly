# ║  TANISH'S SETUP TOOLKIT · tanisheesh.in                              ║
# ║  Feature request form. Goes to: <repo>/.github/ISSUE_TEMPLATE/       ║
# ║  Works as-is in any repo, no placeholders to fill.                   ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: ✨ Feature request
description: Suggest an idea or improvement
title: "✨ "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describing the **problem** first helps more than jumping to a solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I want to share my weekly summary with my team, but I have to copy it by hand.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: A "Copy as Markdown" button on the weekly summary card.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would really help
        - Blocking me
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md)

