# Reqly in two containers: TimescaleDB and the all-in-one image (collector +
# dashboard on port 8000). Put your secrets in a .env file next to this one:
#   REQLY_INGEST_KEY=...  REQLY_READ_KEY=...  POSTGRES_PASSWORD=...
#   REQLY_ADMIN_PASSWORD=...   (first admin; or PUBLIC_DASHBOARD=true)
#   docker compose up -d   ->  http://localhost:8000
services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: reqly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: reqly
    volumes:
      - reqly-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqly -d reqly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  reqly:
    image: ghcr.io/tanisheesh/reqly:${REQLY_VERSION:-latest}
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reqly:${POSTGRES_PASSWORD}@timescaledb:5432/reqly
      REQLY_INGEST_KEY: ${REQLY_INGEST_KEY:?set REQLY_INGEST_KEY}
      REQLY_READ_KEY: ${REQLY_READ_KEY:?set REQLY_READ_KEY}
      REQLY_ADMIN_PASSWORD: ${REQLY_ADMIN_PASSWORD:-}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  reqly-data:
