{{- if not .Values.secrets.existingSecret }}
{{- $pgPassword := include "reqly.persisted" (dict "ctx" $ "key" "postgres-password" "value" .Values.timescaledb.password "length" 24) }}
{{- $dbUrl := .Values.externalDatabaseUrl }}
{{- if .Values.timescaledb.enabled }}
{{- $dbUrl = printf "postgresql://%s:%s@%s:5432/%s" .Values.timescaledb.user (urlquery $pgPassword) (include "reqly.timescaledbHost" .) .Values.timescaledb.database }}
{{- end }}
{{- if not $dbUrl }}
{{- fail "Set timescaledb.enabled=true, externalDatabaseUrl, or secrets.existingSecret with a database-url key." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reqly.secretName" . }}
  labels:
    {{- include "reqly.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  ingest-key: {{ include "reqly.persisted" (dict "ctx" $ "key" "ingest-key" "value" .Values.secrets.ingestKey "length" 32) | quote }}
  read-key: {{ include "reqly.persisted" (dict "ctx" $ "key" "read-key" "value" .Values.secrets.readKey "length" 32) | quote }}
  postgres-password: {{ $pgPassword | quote }}
  database-url: {{ $dbUrl | quote }}
  {{- with .Values.secrets.groqApiKey }}
  groq-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  admin-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackWebhookUrl }}
  slack-webhook-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.discordWebhookUrl }}
  discord-webhook-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.webhookUrl }}
  webhook-url: {{ . | quote }}
  {{- end }}
{{- end }}
