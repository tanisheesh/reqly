[project]
name = "reqly-collector"
version = "0.14.0"
description = "Reqly collector: ingests SDK telemetry into TimescaleDB and serves dashboard/insights queries."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "slowapi>=0.1.9",
    "apscheduler>=3.10,<4.0",
    "openai>=1.40",
    "opentelemetry-proto>=1.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pyflakes, import order and bugbear. Not B008 (FastAPI's Depends() defaults),
# B904 (HTTPException translation is deliberate) or B905 (zip strictness).
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
files = ["app"]
python_version = "3.11"
# Framework and driver packages ship partial or no stubs.
ignore_missing_imports = true
