[project]
name = "reqly-collector"
version = "0.1.1"
description = "Reqly collector: ingests SDK telemetry into TimescaleDB and serves dashboard/insights queries."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "slowapi>=0.1.9",
    "apscheduler>=3.10,<4.0",
    "groq>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
lambda = [
    "mangum>=0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
