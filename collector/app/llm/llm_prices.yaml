# LLM prices used to estimate cost per route, in USD per 1M tokens.
#
# These are list prices for standard (non-batch, non-cached) usage as the
# providers published them; they change, and your contract may differ. Copy
# this file, edit it, and point LLM_PRICES_FILE at your copy -- entries
# there override and extend these. Costs are computed when queried, so a
# price change applies to past usage too.
#
# Model names match by longest prefix, case-insensitive, after dropping a
# provider prefix ("openai/gpt-4o-2024-08-06" -> "gpt-4o"). Models with no
# match are reported as unpriced, never guessed.

as_of: "2025-10"

models:
  # OpenAI
  gpt-5:            {input: 1.25,  output: 10.00}
  gpt-5-mini:       {input: 0.25,  output: 2.00}
  gpt-5-nano:       {input: 0.05,  output: 0.40}
  gpt-4.1:          {input: 2.00,  output: 8.00}
  gpt-4.1-mini:     {input: 0.40,  output: 1.60}
  gpt-4.1-nano:     {input: 0.10,  output: 0.40}
  gpt-4o:           {input: 2.50,  output: 10.00}
  gpt-4o-mini:      {input: 0.15,  output: 0.60}
  o3:               {input: 2.00,  output: 8.00}
  o3-mini:          {input: 1.10,  output: 4.40}
  o4-mini:          {input: 1.10,  output: 4.40}
  # Anthropic
  claude-opus-4:    {input: 15.00, output: 75.00}
  claude-opus-4-5:  {input: 5.00,  output: 25.00}
  claude-sonnet-4:  {input: 3.00,  output: 15.00}
  claude-haiku-4-5: {input: 1.00,  output: 5.00}
  claude-3-5-haiku: {input: 0.80,  output: 4.00}
  # Google
  gemini-2.5-pro:   {input: 1.25,  output: 10.00}
  gemini-2.5-flash: {input: 0.30,  output: 2.50}
