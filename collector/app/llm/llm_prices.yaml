# LLM prices used to estimate cost per route, in USD per 1M tokens.
#
# These are list prices for standard (non-batch, non-cached) usage as the
# providers published them; they change, and your contract may differ. Copy
# this file, edit it, and point LLM_PRICES_FILE at your copy -- entries
# there override and extend these. Costs are computed when queried, so a
# price change applies to past usage too.
#
# A model name matches a key when it is the key itself or the key plus a
# snapshot suffix (a date like -2024-08-06 / -20250514, -latest, -preview,
# -001), case-insensitive, after dropping a provider prefix
# ("openai/gpt-4o-2024-08-06" -> gpt-4o, "anthropic.claude-opus-5-5" -> claude-opus-5-5).
# "gpt-4o-mini" is its own key, not a gpt-4o snapshot; a model with no key is
# reported as unpriced, never guessed from a similar name.
#
# Sources (checked 2026-10-11): developers.openai.com/api/docs/pricing,
# platform.claude.com/docs/en/about-claude/pricing,
# ai.google.dev/gemini-api/docs/pricing, console.groq.com/docs/models.
# Tiered prices use the lower tier (short prompts); see the notes.

